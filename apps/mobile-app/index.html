<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <!--
      A shopper credential must never travel in a URL, so no page here is
      ever linked to with one. Telling the browser not to send a referrer at
      all is belt and braces: it also stops the API's origin leaking to any
      third party the shopper navigates to afterwards.
    -->
    <meta name="referrer" content="no-referrer" />
    <title>BYOND Store</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e6b73'/%3E%3Ctext x='16' y='21' font-family='Arial,sans-serif' font-size='13' font-weight='700' fill='%23fff' text-anchor='middle'%3EBY%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
