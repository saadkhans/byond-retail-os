<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>BYOND Admin</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e6b73'/%3E%3Ctext x='16' y='21' font-family='Arial,sans-serif' font-size='13' font-weight='700' fill='%23fff' text-anchor='middle'%3EBY%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <script>
      // Apply the persisted theme before first paint (no flash). Mirrors
      // src/ui/theme.ts: 'light' | 'dark' stamps data-theme; 'system' or a
      // missing/blocked store leaves the document unstamped.
      (function () {
        try {
          var value = window.localStorage.getItem('byond.admin.theme');
          if (value === 'light' || value === 'dark') {
            document.documentElement.setAttribute('data-theme', value);
          }
        } catch (e) {
          /* storage blocked: fall back to the system theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
